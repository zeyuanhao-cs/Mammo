# =============================================================================
# patch-zoom 局部放大诊断实验 (x074): 224x224 局部块 4-findings 多标签
#   与 train_lora_2view_os_sub_vt.yaml 完全一致, 仅:
#     (1) 单图输入 (局部块), 输出只含 4 个 findings;
#     (2) 图像像素预算固定为 25600 (x074 尺度), min=max 强制缩放;
#     (3) num_train_epochs: 2.0
# 运行: llamafactory-cli train 2-view/configs/patch_zoom_x074.yaml
# =============================================================================

### dataset_dir
dataset_dir: /nesi/project/massey04900/Mammography/patch_zoom/lf

### model
model_name_or_path: /nesi/project/massey04900/Mammography/model/Qwen3.5-4B
trust_remote_code: true
image_max_pixels: 25600
image_min_pixels: 25600
flash_attn: sdpa

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: false  # 解冻视觉塔: visual.blocks 纳入 LoRA 目标

### dataset
dataset: patch_zoom_train
template: qwen3_5_nothink
cutoff_len: 2048
val_size: 0
preprocessing_num_workers: 8
dataloader_num_workers: 0

### output
output_dir: /nesi/project/massey04900/Mammography/model/Qwen3.5-4B-lora-patch-x074
resume_from_checkpoint: false
logging_steps: 10
save_steps: 50
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
### eval
eval_strategy: "no"
