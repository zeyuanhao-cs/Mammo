# =============================================================================
# VinDr-Mammo 2-view (CC+MLO) × Qwen3.5-4B LoRA SFT — Repeat-OS 子训练集版本
# 训练集: train_sub_repeat_os.json (7019 条, 基于去掉 20% val 后的 6399 条重采样;
#   BI-RADS/findings repeat-based OS, cap=4, seed=42; 4+5: 314->726, all-zero 90.5%->82.5%)
# 其余配置与 train_lora_2view_os.yaml 完全一致 (仅换数据集和输出目录)
#
# 运行: llamafactory-cli train 2-view/configs/train_lora_2view_os_sub.yaml
# 断点续训: 把 resume_from_checkpoint 改为 true
# =============================================================================

### dataset_dir
dataset_dir: /home/zhao/Mammography/Mammo/2-view/data

### model
model_name_or_path: /nesi/project/massey04900/Mammography/model/Qwen3.5-4B
trust_remote_code: true
image_max_pixels: 786432
image_min_pixels: 262144
flash_attn: sdpa

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

### dataset
dataset: vindr_2view_train_os_sub
template: qwen3_5_nothink
cutoff_len: 4096
val_size: 0
preprocessing_num_workers: 8  # dill 补丁后多进程可用
dataloader_num_workers: 0  # worker 子进程无法 pickle 梯度检查点局部函数, 改主进程加载

### output
output_dir: /nesi/project/massey04900/Mammography/model/Qwen3.5-4B-lora-2view-os-sub
resume_from_checkpoint: false
logging_steps: 10
save_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
### eval
eval_strategy: "no"
