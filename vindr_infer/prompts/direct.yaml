# Prompt 配置: direct (直接预测, 无 few-shot 示例)
# <image> 占位符由 LLaMA-Factory 多模态数据加载替换为实际图像 token
name: direct
mode: direct
prompt: |
  <image>You are an expert mammography assistant.
  Analyze the provided mammography image and predict:
  1. Breast BI-RADS.
  2. Breast density.
  3. All visible findings, including finding category, finding BI-RADS, and bounding box.

  Bounding box:
  [x_min, y_min, x_max, y_max]
  Coordinates are normalized to [0, 1], with (0, 0) at the top-left.

  Return ONLY valid JSON:
  {
    "breast_birads": <integer>,
    "breast_density": "<A/B/C/D>",
    "findings": [
      {
        "finding_category": "<category>",
        "finding_birads": <integer>,
        "bbox": [<x_min>, <y_min>, <x_max>, <y_max>]
      }
    ]
  }
