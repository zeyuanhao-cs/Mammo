# =============================================================================
# VinDr-Mammo × Qwen3.5-4B LoRA SFT (direct prompt)
# 训练集 16,000 / 测试集 4,000, 无独立 val (与 Mammo-CLIP 官方一致)
# val_size: 0.1 是 LLaMA-Factory 训练时从 train 动态划 10% 做 eval loss 监控
#
# 运行 (yu.w 的 h200 Slurm 容器):
#   llamafactory-cli train /mammo/vindr_finetune/trial.yaml
# =============================================================================

### dataset_dir 存放 dataset_info.json；media_dir 解析 images_png/... 相对路径
dataset_dir: /mammo/vindr_finetune
media_dir: /mammo

### model
model_name_or_path: /data/models/Qwen3.5-4B
trust_remote_code: true
image_max_pixels: 1386240
flash_attn: sdpa

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

### dataset
dataset: vindr_direct_train
template: qwen3_5_nothink
cutoff_len: 4096
val_size: 0.1
preprocessing_num_workers: 8
dataloader_num_workers: 2

### output
output_dir: /data/me/mammo/qwen3.5-4b-lora
logging_steps: 10
save_steps: 500
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
