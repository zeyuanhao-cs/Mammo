# Experiment 1: collaborator main@20e980b recipe, with Qwen3.5-9B.
# run_exp1_9b.sh resolves dataset/output paths into a per-job config.
dataset_dir: vindr_finetune
media_dir: /mammo
model_name_or_path: /data/models/Qwen3.5-9B
trust_remote_code: true
image_max_pixels: 786432
flash_attn: sdpa
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all
dataset: vindr_balanced_train
template: qwen3_5_nothink
cutoff_len: 4096
val_size: 0
preprocessing_num_workers: 8
dataloader_num_workers: 4
output_dir: /data/me/mammo/qwen3.5-9b-balanced-2to1
logging_steps: 10
save_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
report_to: none
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
eval_strategy: "no"
